<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Greek column outline: capital (top flare), shaft, base (bottom flare).
       The left half draws at 100% opacity, the right half at 50%. The
       midline at x=8 is intentionally NOT stroked so the column reads as
       one continuous silhouette with a tint gradient. -->
  <g stroke="#FFFFFF" stroke-width="1.1" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 8 1.5 L 2 1.5 L 2 3.5 L 3.5 3.5 L 3.5 12 L 2 12 L 2 14.5 L 8 14.5"/>
    <line x1="5.7" y1="4.2" x2="5.7" y2="11.8"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="1.1" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.5">
    <path d="M 8 1.5 L 14 1.5 L 14 3.5 L 12.5 3.5 L 12.5 12 L 14 12 L 14 14.5 L 8 14.5"/>
    <line x1="10.3" y1="4.2" x2="10.3" y2="11.8"/>
  </g>
</svg>
