<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Editor block in isometric projection (rhombus top, two parallelogram
       sides). The FRONT corner of the top rhombus is lowered 2 px, so the
       top face becomes a non-planar quad. The diagonal right-left splits
       the top into a flat triangle (back side) and a slope triangle (front
       side). The three vertices of the slope triangle carry dots. -->
  <g stroke="#FFFFFF" stroke-width="1.1" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 8 3 L 13 5.6 L 8 10.2 L 3 5.6 Z"/>
    <line x1="3" y1="5.6" x2="13" y2="5.6" opacity="0.55"/>
    <path d="M 8 10.2 L 13 5.6 L 13 11.6 L 8 14.2 Z"/>
    <path d="M 8 10.2 L 3 5.6 L 3 11.6 L 8 14.2 Z"/>
  </g>
  <circle cx="8"  cy="10.2" r="1.3" fill="#FFFFFF"/>
  <circle cx="13" cy="5.6"  r="1.3" fill="#FFFFFF"/>
  <circle cx="3"  cy="5.6"  r="1.3" fill="#FFFFFF"/>
</svg>
