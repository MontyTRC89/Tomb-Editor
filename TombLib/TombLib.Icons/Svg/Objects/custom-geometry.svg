<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Stylised icosahedron: hexagonal silhouette with internal triangulation
       at 50% opacity to suggest the inner facets of a d20-style solid. -->
  <polygon points="8,1.5 14,5 14,11 8,14.5 2,11 2,5"
           fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linejoin="round"/>
  <g stroke="#FFFFFF" stroke-width="0.9" opacity="0.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="8"  y1="1.5" x2="8"  y2="14.5"/>
    <line x1="2"  y1="5"   x2="14" y2="11"/>
    <line x1="2"  y1="11"  x2="14" y2="5"/>
  </g>
</svg>
