<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Isometric quarter pipe mirrored on the vertical axis (apex on the
       right). Same wedge silhouette as the half pipe but with a flatter
       slope curve: the Q controls are pulled closer to the straight
       midpoint to reduce the concavity. -->
  <g stroke="#FFFFFF" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 12 10 L 8 13 L 4 10 Q 7 8.5 8 4 L 12 6 Z"/>
    <path d="M 8 13 Q 11 11.5 12 6" opacity="0.8"/>
  </g>
</svg>
