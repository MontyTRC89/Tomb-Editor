<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Isometric half pipe mirrored on the vertical axis (apex on the
       right). Same wedge geometry as the quarter pipe; the slope curves
       are deeper (closer to a quarter-circle) so the concavity reads
       stronger than the flatter quarter-pipe version. -->
  <g stroke="#FFFFFF" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 12 10 L 8 13 L 4 10 Q 8 10 8 4 L 12 6 Z"/>
    <path d="M 8 13 Q 12 13 12 6" opacity="0.8"/>
  </g>
</svg>
