<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Two overlapping rounded squares (the copy metaphor) with a chain
       symbol over the intersection (the link half). The chain replaces
       the legacy rotated bar so the icon reads as a real link. -->
  <rect x="1.5" y="1.5" width="9" height="11" fill="none" stroke="#FFFFFF" stroke-width="1.3" opacity="0.55"/>
  <rect x="5.5" y="4.5" width="9" height="10" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>

  <!-- Chain: two interlocking oblong rings. Tilted -35 deg around the
       intersection centre so they sit diagonally inside the squares. -->
  <g transform="translate(8 9.5) rotate(-35)" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linejoin="round">
    <rect x="-5" y="-1.6" width="4.6" height="3.2" rx="1.5" ry="1.5"/>
    <rect x="0.4" y="-1.6" width="4.6" height="3.2" rx="1.5" ry="1.5"/>
  </g>
</svg>
